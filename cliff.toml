# Release notes and the next version for khinse-labs repositories: https://git-cliff.org
# Read by the reusable release workflow (.github/workflows/release.yml) from the tag its `cliff-ref` input names.
# Change the commit types here and in cchk.toml together.

[changelog]
# One release's notes, for its GitHub release. The release title shows the version.
# Group 9 (tooling and process) stays out of the notes. The release workflow skips a release
# that contains nothing else.
body = """
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}\
{% if entry.group is not starting_with("<!-- 9 -->") %}
### {{ entry.group | striptags | trim }}
{% for commit in entry.commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {{ commit.message | upper_first }}\
{% endfor %}
{% endif %}\
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
# The HTML comments order the groups, and the release notes don't show them.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^revert", group = "<!-- 6 -->Reverts" },
  { message = "^(chore|ci|build|style|test)", group = "<!-- 9 -->Maintenance" },
]
# Only full versions are releases. Moving major tags such as v1 are not.
tag_pattern = '^v[0-9]+\.[0-9]+\.[0-9]+$'
topo_order_commits = true
sort_commits = "oldest"

[bump]
# Conventional semver: feat bumps the minor version and a breaking change the major, also before 1.0.0.
features_always_bump_minor = true
breaking_always_bump_major = true
initial_tag = "v0.1.0"
