name: Labels sync

# Creates and updates the khinse-labs standard labels. Never deletes a label.
# Logic: khinse-labs/.github, .github/workflows/labels-sync.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

permissions: {}

jobs:
  sync:
    permissions:
      issues: write
    uses: khinse-labs/.github/.github/workflows/labels-sync.yml@main
    # with:
    #   runs-on: ubuntu-latest
