name: Bug report
description: Report something that is broken or behaves unexpectedly.
type: Bug
projects: ["khinse-labs/1"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. For security vulnerabilities, do not open an issue; follow the security policy instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact steps that trigger the bug.
      placeholder: |
        1. Go to ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened. Include screenshots or error messages if you have them.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and browser
      description: Device, operating system and browser, with versions.
      placeholder: e.g. Pixel 8, Android 16, Chrome 140
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or commit where you saw the bug.
      placeholder: e.g. v0.4.0 or a1b2c3d
    validations:
      required: false
