name: Feature request
description: Propose a new feature or an improvement.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Concrete, testable conditions that must be true for this to be done.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: open-questions
    attributes:
      label: Open questions
      description: >-
        One checklist item per unknown. Tick each with a link to the comment that answers it, or with
        "settle in PR". Every box is ticked before the issue is Ready. The PR that settles a question
        adds the decision record or doc change.
      value: "- [ ] "
    validations:
      required: false
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this feature deliberately does not cover.
    validations:
      required: false
