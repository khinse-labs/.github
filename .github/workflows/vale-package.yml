name: Vale package

# Builds the khinse-labs Vale package from vale/khinse-labs and attaches it to a release as
# khinse-labs.zip. Repositories put the asset URL in the Packages key of their .vale.ini. Usage:
# README.md, section "Shared Vale config".
#
# A release made with GITHUB_TOKEN (for example by release.yml) does not start other workflows,
# this one included. Run it by hand then, with `workflow_dispatch` and the tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release, such as v0.2.0. The workflow builds the package at this tag.
        type: string
        required: true

permissions: {}

jobs:
  # Downloads Vale and the packages that the package names. It runs apart from the upload, with a
  # token that can read but not write.
  test:
    name: Test the rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # refs/tags/ makes the checkout fail for a branch name or a SHA.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      # Vale 3.28.1 ignores the #sha256: of a Packages entry, so this step checks each one itself.
      # It reads the entries from the package .vale.ini, the one place that lists them. Every
      # entry must be a URL over HTTPS, with a digest. `vale sync` downloads them again in the next step.
      - name: Check the package digests
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/package-check"
          entries=$(sed -e ':a' -e '/\\$/N; s/\\\n//; ta' vale/khinse-labs/.vale.ini |
            sed -n 's/^Packages[[:space:]]*=//p' | tr ',' '\n' |
            sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' || true)
          if [ -z "$entries" ]; then
            echo "::error::vale/khinse-labs/.vale.ini has no Packages entries."
            exit 1
          fi
          while IFS= read -r entry; do
            url=${entry%%#*}
            digest=${entry#*#sha256:}
            if [[ $url != https://* || $entry != *'#sha256:'* || ! $digest =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::Packages entry '$entry' is not an https URL with #sha256:<digest>."
              exit 1
            fi
            file="$RUNNER_TEMP/package-check/$(basename "$url")"
            curl -sSfL -o "$file" "$url"
            echo "$digest  $file" | sha256sum -c -
          done <<<"$entries"

      # This step pins the digest instead of reading it from the checksums file of the same release.
      # A replaced archive then fails the check.
      - name: Install Vale
        env:
          VALE_VERSION: 3.28.1
          VALE_SHA256: 068954ad869ebec24b8dec6ebcd1cbb1fd5f5a83e966a35baedfae8b2cdc093a
        run: |
          set -euo pipefail
          archive="vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/$archive"
          echo "$VALE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/vale-bin"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/vale-bin" vale
          echo "$RUNNER_TEMP/vale-bin" >>"$GITHUB_PATH"

      # Installs the package from its folder into a scratch StylesPath, with the packages it names,
      # as a repository does. The rules then run their own tests. The sync writes nothing to the
      # checkout, which the zip packs. The config lists the grammars of the Prose view, as a
      # repository's does: one sync does not install the package's.
      - name: Test the rules
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vale-test"
          cd "$RUNNER_TEMP/vale-test"
          printf 'StylesPath = styles\nPackages = %s\nGrammars = yaml, toml, typescript, bash\n' \
            "$GITHUB_WORKSPACE/vale/khinse-labs" >.vale.ini
          vale sync --plain-progress
          vale test --coverage styles/khinse-labs styles/SE

  package:
    name: Build and upload khinse-labs.zip
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write # uploads the release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      # The zip has one top-level folder, khinse-labs/, named like the file, as Vale requires. Fixed
      # dates and a sorted file list make a rebuild of one tag give the same bytes. A repository can
      # pin the digest of the archive, and the clobber option of the upload then replaces it with an
      # equal file.
      - name: Build the package
        working-directory: vale
        run: |
          set -euo pipefail
          find khinse-labs -exec touch -h -d '1980-01-01T00:00:00Z' {} +
          find khinse-labs -print | LC_ALL=C sort | zip -X -q "$RUNNER_TEMP/khinse-labs.zip" -@
          if ! unzip -l "$RUNNER_TEMP/khinse-labs.zip" | grep -q ' khinse-labs/\.vale\.ini$'; then
            echo "::error::khinse-labs.zip has no khinse-labs/.vale.ini."
            exit 1
          fi

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/khinse-labs.zip" --clobber --repo "$REPO"
          digest=$(sha256sum "$RUNNER_TEMP/khinse-labs.zip" | cut -d' ' -f1)
          echo "Uploaded khinse-labs.zip to $TAG. SHA-256: \`$digest\`" >>"$GITHUB_STEP_SUMMARY"
