name: Labels sync

# Creates or updates the labels in labels.yml of khinse-labs/.github in the calling repository. It never
# deletes a label. labels.yml is read from the public repository's default branch, so no token is
# needed for that. Needs yq on the runner (GitHub-hosted Ubuntu runners have it).
# Call it from workflow-templates/labels-sync.yml; the calling job must grant issues: write.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest

permissions: {}

jobs:
  sync:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      issues: write
    timeout-minutes: 10
    steps:
      - name: Sync labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --output labels.yml \
            "https://raw.githubusercontent.com/khinse-labs/.github/main/labels.yml"

          count=$(yq 'length' labels.yml)
          [ "$count" -gt 0 ] || { echo "::error::labels.yml is empty"; exit 1; }

          for i in $(seq 0 $((count - 1))); do
            name=$(yq ".[$i].name" labels.yml)
            color=$(yq ".[$i].color" labels.yml)
            description=$(yq ".[$i].description" labels.yml)
            gh label create "$name" --repo "$REPO" --color "$color" \
              --description "$description" --force
          done
