name: Vale

# Reusable prose check for khinse-labs repositories. It runs Vale with the shared khinse-labs package
# on the whole `files` path and passes the alerts to reviewdog. reviewdog's filter-mode then picks
# which alerts it reports, by default those on the lines the pull request changes. Usage and
# caveats: README.md, section "Shared Vale config".
#
# The caller repository needs a .vale.ini at its root whose Packages key names khinse-labs.zip. The
# action runs `vale sync` before it lints, so the caller does not commit the synced styles.
#
# This workflow sets no permissions. Its job gets exactly what the calling job grants, so the caller
# grants what its reporter needs (see README.md). A key set here would also bind callers whose
# reporter does not need it, because a called job can never hold more than its caller gives.

on:
  workflow_call:
    inputs:
      files:
        description: >-
          What Vale lints: a file or folder, a JSON list such as '["docs", "README.md"]', or `all`
          for the whole repository.
        type: string
        default: .
      vale-version:
        description: Vale version to install, without the leading v.
        type: string
        default: 3.28.1
      fail-on-error:
        description: >-
          Fail the job when Vale reports an alert at the level error. Alerts at the level warning
          never fail it.
        type: boolean
        default: true
      reporter:
        description: >-
          reviewdog reporter. Every reporter needs pull-requests read for the diff.
          github-pr-check and github-check write a check run and need checks write.
          github-pr-review writes review comments with suggested fixes and needs pull-requests write.
          github-pr-annotations writes annotations through the job log and needs no write permission.
        type: string
        default: github-pr-check
      filter-mode:
        description: >-
          reviewdog filter mode. added reports alerts on added or changed lines only. diff_context,
          file and nofilter report more.
        type: string
        default: added

jobs:
  vale:
    name: Vale
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Before the checkout, so a wrong input costs nothing.
      - name: Check the inputs
        env:
          REPORTER: ${{ inputs.reporter }}
          FILTER_MODE: ${{ inputs.filter-mode }}
        run: |
          set -euo pipefail
          case $REPORTER in github-pr-check | github-pr-review | github-check | github-pr-annotations) ;; *)
            echo "::error::reporter must be github-pr-check, github-pr-review, github-check or github-pr-annotations, not $REPORTER"
            exit 1
            ;;
          esac
          case $FILTER_MODE in added | diff_context | file | nofilter) ;; *)
            echo "::error::filter-mode must be added, diff_context, file or nofilter, not $FILTER_MODE"
            exit 1
            ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without the Packages line, Vale lints without the shared rules and can pass with no alert.
      - name: Check the Vale config
        run: |
          set -euo pipefail
          if [ ! -f .vale.ini ]; then
            echo "::error file=.vale.ini::This repository has no .vale.ini. Add one with the Packages line from the README of khinse-labs/.github, section \"Shared Vale config\"."
            exit 1
          fi
          if ! grep -Eq '^[[:space:]]*Packages[[:space:]]*=.*/khinse-labs\.zip' .vale.ini; then
            echo "::error file=.vale.ini::.vale.ini has no Packages line for khinse-labs.zip. Add the line from the README of khinse-labs/.github, section \"Shared Vale config\"."
            exit 1
          fi

      # The action installs Vale and reviewdog and checks both against their published checksums.
      # It runs `vale sync` before it lints.
      - uses: vale-cli/vale-action@518a9136acc6e6668ce7c00d367051e0941e87ff # v3.0.0
        with:
          version: ${{ inputs.vale-version }}
          files: ${{ inputs.files }}
          fail_on_error: ${{ inputs.fail-on-error }}
          reporter: ${{ inputs.reporter }}
          filter_mode: ${{ inputs.filter-mode }}
