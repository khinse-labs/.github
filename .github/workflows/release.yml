name: Release

# Reusable release workflow for khinse-labs repositories. It picks the next version from the
# Conventional Commits since the last tag. It uses git-cliff with the shared cliff.toml of this
# repository. It creates the tag at the triggering commit and publishes a GitHub release with the
# notes, in one call. Usage and caveats: README.md, section "Reusable release workflow".
#
# Skips cleanly (`released` = false) when every unreleased commit is tooling or process (cliff.toml
# group 9: chore, ci, build, style, test) and `bump` is auto. A breaking commit is never in group 9.
#
# The workflow releases from the default branch only. A release made with GITHUB_TOKEN does not
# start other workflows. So a caller that deploys does it in a job of its own. That job has `needs:` for this one
# and reads `tag`.

on:
  workflow_call:
    inputs:
      bump:
        description: Version bump. auto picks it from the commits. patch, minor or major forces it.
        type: string
        default: auto
      include-paths:
        description: >-
          Optional. Glob patterns, separated by spaces or newlines, passed to git-cliff as
          --include-path. Only commits that touch these paths count (for example `apps/app/** packages/**`).
          Empty counts every commit.
        type: string
        default: ""
      cliff-ref:
        description: >-
          Tag (or other ref) of khinse-labs/.github to read cliff.toml from. Callers pin the workflow
          itself by tag. The default then changes only with a new workflow tag. See README.md.
        type: string
        default: v0.1.0
    outputs:
      released:
        description: "true when the workflow made a release, false when it found nothing to release."
        value: ${{ jobs.release.outputs.released }}
      version:
        description: The new version without the leading v (for example 1.2.3). Empty when the workflow did not release.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: The new tag, with the leading v (for example v1.2.3). Empty when the workflow did not release.
        value: ${{ jobs.release.outputs.tag }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Run one release at a time. A second run waits and does not race for the tag. The group is here
    # and not in the caller, because the same group in both deadlocks.
    concurrency:
      group: release
      cancel-in-progress: false
    # The caller's job must grant this too. A called workflow can only use the permissions its caller
    # gives it.
    permissions:
      contents: write # creates the tag and the release
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      # Runs before the checkout, to stop a wrong ref early. Also checks the inputs.
      - name: Check the ref and the inputs
        env:
          BUMP: ${{ inputs.bump }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::Releases are cut from the default branch, not $REF."
            exit 1
          fi
          case $BUMP in auto | major | minor | patch) ;; *)
            echo "::error::bump must be auto, major, minor or patch, not $BUMP"
            exit 1
            ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The shared git-cliff config, at the pinned ref. Public repository: the workflow token reads it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: khinse-labs/.github
          ref: ${{ inputs.cliff-ref }}
          path: .release-config
          sparse-checkout: cliff.toml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # A pinned uv installs git-cliff from PyPI at an exact version. PyPI does not let an owner replace
      # the files of a version, but the package files are not hash-checked here. setup-uv checks the
      # checksum of the uv it downloads. No cache: this job can publish.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.7"
          enable-cache: false

      - name: Plan the release
        id: plan
        env:
          BUMP: ${{ inputs.bump }}
          INCLUDE_PATHS: ${{ inputs.include-paths }}
        run: |
          set -euo pipefail

          # No globbing: the include paths are git-cliff globs, not shell ones.
          set -f
          paths=()
          for path in $INCLUDE_PATHS; do paths+=(--include-path "$path"); done
          set +f

          cliff() { uvx --quiet git-cliff@2.14.2 --config .release-config/cliff.toml "${paths[@]}" "$@"; }

          # Commits outside group 9 (tooling and process). A breaking commit is always in group 0.
          # A commit with no group (a type cliff.toml doesn't list) counts as user-facing.
          user_facing=$(cliff --unreleased --context |
            jq '[.[0].commits[]? | select((.group // "") | startswith("<!-- 9 -->") | not)] | length')
          if [ "$BUMP" = auto ] && [ "$user_facing" -eq 0 ]; then
            echo "::notice::Nothing to release: the unreleased commits are all tooling or process."
            echo "Nothing to release: the unreleased commits are all tooling or process. No tag." >>"$GITHUB_STEP_SUMMARY"
            echo "release=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          tag=$(cliff --bumped-version --bump "$BUMP")
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::git-cliff gave '$tag', which is not a version tag like v0.1.0."
            exit 1
          fi
          # gh release create uses a tag that exists already, so refuse it here.
          if git rev-parse --quiet --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::The tag $tag exists already."
            exit 1
          fi
          cliff --unreleased --bump "$BUMP" --strip all --output "$RUNNER_TEMP/release-notes.md"

          {
            echo "release=true"
            echo "tag=$tag"
          } >>"$GITHUB_OUTPUT"

      - name: Tag and publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.plan.outputs.release }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ "$RELEASE" != true ]; then
            echo "released=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::$TAG is already released."
            exit 1
          fi

          # One call makes the tag and the release, so a stop between the two cannot leave a tag with no
          # release. The tag is lightweight. --target is the commit that triggered the run.
          # --fail-on-no-commits refuses a forced bump when no commit follows the last release.
          gh release create "$TAG" --repo "$REPO" --target "$SHA" --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --fail-on-no-commits

          {
            echo "released=true"
            echo "tag=$TAG"
            echo "version=${TAG#v}"
          } >>"$GITHUB_OUTPUT"
          echo "Released $TAG" >>"$GITHUB_STEP_SUMMARY"
