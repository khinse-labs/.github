name: Main guard

# Free-plan substitute for branch protection on private repositories: after a push to the default
# branch, opens an issue when the pushed commit does not come from a merged pull request, or when the
# push was forced. It cannot block the push; it makes it visible.
# Call it from a `push` workflow on the default branch (workflow-templates/main-guard.yml). The calling
# job must grant contents: read, pull-requests: read and issues: write.
on:
  workflow_call:
    inputs:
      runs-on:
        description: Runner label for the job.
        type: string
        default: ubuntu-latest

permissions: {}

jobs:
  guard:
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      pull-requests: read
      issues: write
    timeout-minutes: 5
    steps:
      - name: Check the pushed commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.event.after }}
          FORCED: ${{ github.event.forced }}
          DELETED: ${{ github.event.deleted }}
          PUSHER: ${{ github.event.pusher.name }}
          ACTOR: ${{ github.actor }}
          COMPARE: ${{ github.event.compare }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ "$DELETED" = "true" ]; then
            echo "Branch deleted; nothing to check."
            exit 0
          fi

          branch="${REF#refs/heads/}"

          # The commit is associated with its PR a moment after the merge, so retry before deciding.
          merged=0
          for _ in 1 2 3; do
            merged=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
              --jq "[.[] | select(.merged_at != null and .base.ref == \"${branch}\")] | length")
            [ "$merged" -gt 0 ] && break
            sleep 10
          done

          reasons=()
          [ "$merged" -eq 0 ] && reasons+=("the head commit is not part of a merged pull request")
          [ "$FORCED" = "true" ] && reasons+=("the push was forced")

          if [ "${#reasons[@]}" -eq 0 ]; then
            echo "Commit ${SHA} came from a merged pull request."
            exit 0
          fi

          forced_text="No"
          [ "$FORCED" = "true" ] && forced_text="Yes"
          reason_text=$(printf -- '- %s\n' "${reasons[@]}")

          gh label create direct-push --repo "$REPO" --color b60205 \
            --description "A commit reached the default branch without a merged pull request" \
            2>/dev/null || true

          body=$(printf '%s\n' \
            "A push to \`${branch}\` did not come through a merged pull request." \
            "" \
            "- Pushed by: @${PUSHER:-$ACTOR}" \
            "- Head commit: \`${SHA}\`" \
            "- Forced: ${forced_text}" \
            "- Compare: ${COMPARE}" \
            "- Workflow run: ${RUN_URL}" \
            "" \
            "Why it was flagged:" \
            "" \
            "${reason_text}" \
            "" \
            "Every change reaches \`${branch}\` through a pull request. Review the commits above, and revert them or open a pull request for them.")

          gh issue create --repo "$REPO" --label direct-push \
            --title "Direct push to ${branch} by ${PUSHER:-$ACTOR}" --body "$body"
