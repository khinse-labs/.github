# The label set for khinse-labs repositories. It is set as the organisation's default labels for new
# repositories, and applied to existing ones by hand (see "Labels" in CONTRIBUTING.md).
# The triage labels match the roles the triage skills use; the area labels are in CONTRIBUTING.md.

# Triage
- name: needs-triage
  color: "fbca04"
  description: A maintainer needs to evaluate this issue
- name: needs-info
  color: "d93f0b"
  description: Waiting on the reporter for more information
- name: ready-for-agent
  color: "0e8a16"
  description: Fully specified, ready for an AI agent to implement
- name: ready-for-human
  color: "1d76db"
  description: Requires human implementation
- name: wontfix
  color: "ffffff"
  description: Will not be actioned

# Community
- name: good first issue
  color: "7057ff"
  description: Good for newcomers
- name: help wanted
  color: "008672"
  description: Extra attention is needed

# Cross-cutting
- name: accessibility
  color: "c5def5"
  description: Accessibility
- name: documentation
  color: "0075ca"
  description: Improvements or additions to documentation

# Area
- name: ui
  color: "bfd4f2"
  description: "Area: user interface"
- name: api
  color: "bfd4f2"
  description: "Area: API"
- name: data
  color: "bfd4f2"
  description: "Area: data and storage"
- name: auth
  color: "bfd4f2"
  description: "Area: authentication and accounts"
- name: i18n
  color: "bfd4f2"
  description: "Area: internationalisation"
- name: privacy
  color: "bfd4f2"
  description: "Area: privacy"
- name: security
  color: "b60205"
  description: "Area: security"
- name: performance
  color: "bfd4f2"
  description: "Area: performance"
- name: ci
  color: "bfd4f2"
  description: "Area: CI and tooling"

# Governance
- name: direct-push
  color: "b60205"
  description: A commit reached the default branch without a merged pull request
