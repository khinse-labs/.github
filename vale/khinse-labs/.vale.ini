# Base Vale config of the khinse-labs package. `vale sync` copies it into
# <StylesPath>/.vale-config/ of the repository, and Vale reads it before the repository's own
# .vale.ini. In the repository's file, a list key such as BasedOnStyles adds to the values here, and
# any other key, such as a rule level, replaces them. Usage: README.md, section "Shared Vale config".
#
# No StylesPath here: the repository's .vale.ini sets it.
MinAlertLevel = warning

# The grammars let Vale find the comments of YAML, TOML, TypeScript and shell files. The Prose view
# below and the Mts and Comments views need them. Vale installs only the grammars in this list,
# and a .mts glob alone does not install the TypeScript one. The first `vale sync` installs the
# package but not the grammars it names, so the repository's .vale.ini names them too. Without a
# grammar, Vale reads a comment as the text after its delimiter, even in a string.
Grammars = yaml, toml, typescript, bash

# Packages from the Vale package library. `vale sync` installs them beside this package. Each one is
# pinned to a release and to the SHA-256 of its archive. Only Vale 3.29.0 or later checks the digest.
# To update one, change the tag and the digest together: `vale sync --plain-progress` prints the
# digest of an archive that is not pinned.
#
# Only Commits has a .vale.ini, and it sets MinAlertLevel = suggestion. `vale sync` copies it to
# .vale-config/ as 0-Commits.ini, from its index in this list, and Vale reads that folder in name
# order. Keep Commits first: its file then comes before <n>-khinse-labs.ini, and this file wins.
Packages = https://github.com/jdkato/commits/releases/download/v0.2.0/Commits.zip#sha256:ed383cd2233d24ca725e4546fa3a51e3e85684906c61420df9246ac889a52e39, \
  https://github.com/vale-cli/write-good/releases/download/v0.5.0/write-good.zip#sha256:1736c0b61aed16170d5af65f602d776a06dc1a563bc6552abfe5db6940190e22, \
  https://github.com/vale-cli/Readability/releases/download/v0.2.0/Readability.zip#sha256:cf8790677bb2ef86458c1d1dbd6e646fd8063c0e9621f81141e5cd85e5e41f81, \
  https://github.com/jdkato/Prompts/releases/download/v0.1.1/Prompts.zip#sha256:e06ee5b57e7f690f93c26a4cc1e644869b9aa078dd3700bd9c944f3545cdf4d7, \
  https://github.com/jdkato/Modelese/releases/download/v0.2.0/Modelese.zip#sha256:40b70578dc0e4437c9d7f7e29a283e960212553ecf068ea48feb725ccba27d5e, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip#sha256:f8d1e981abbfbac1aa092d1623a1ac9bc935f0b15e8071e7a072915abddf0570

# The package has no [*.mts] sections, because their globs are paths of one repository. A
# repository that lints the prose of .mts files adds sections such as these to its own .vale.ini.
# Mts takes comments and message strings, Comments takes comments only. The sections must not
# overlap: Vale picks one of two matching sections at random.
#
#   [{scripts,src}/**/*.mts]
#   View = Mts
#
#   [tests/**/*.mts]
#   View = Comments

[*]
BasedOnStyles = write-good, Readability, Modelese, ai-tells, Vale
# The vocabulary in styles/config/vocabularies/khinse-labs holds the terms that Vale.Spelling
# accepts in every khinse-labs repository. A word with an underscore inside it, such as a config key
# in a comment, is an identifier and not English, so the list accepts it. A word with an underscore
# only at one end is still checked. Needs Vale 3.25.0 or later.
Vocab = khinse-labs
# Vale makes a Terms rule for each vocabulary, Vale.khinse-labs.Terms for this one. It asks for the
# exact case of an entry, such as "TSDoc" and "Quarkus". An entry whose case varies, such as "env",
# starts with (?i): spelling accepts it, and the Terms rule leaves its case alone. "ci" is such an
# entry, because it is also a commit type and a file name, such as ci.yml. Vale.Terms is the rule
# of a vocabulary that a repository names at the top of its own .vale.ini.
Vale.Terms = error
Vale.khinse-labs.Terms = error
Vale.Avoid = NO
# Every rule that is on gives an error. The packages give their rules mixed levels, so each style,
# or each rule of a style that is not all on, is set to error here.
Vale.Spelling = error
Vale.Repetition = error
Modelese = error
# Every write-good rule but E-Prime is on.
write-good.Passive = error
write-good.TooWordy = error
write-good.Weasel = error
write-good.Illusions = error
write-good.Adverbs = error
write-good.Cliches = error
write-good.E-Prime = NO
write-good.So = error
write-good.ThereIs = error
# One readability score, the Automated Readability Index, per paragraph, so the alert lands where
# the text reads hard. It stands in for limits on sentence and paragraph length, so the other scores
# are off. A short paragraph with one long word scores high, so a paragraph needs 25 words to count.
# The limit is 9, but the message of the rule still says "below 8": a config cannot change a
# message. Inline code in Markdown does not count toward the score. In a commit body, a bare
# identifier or path counts as one long word and raises it. Backticks help in both.
Readability = NO
Readability.AutomatedReadability = error
Readability.AutomatedReadability[scope] = paragraph
Readability.AutomatedReadability[condition] = "> 9 && words >= 25"
# Every ai-tells rule is an error in the package, and this line keeps them errors.
ai-tells = error

# Vale reads a YAML or TOML file whole, as plain text, unless a view picks its prose. The Prose view
# picks the comments and the values of prose keys, such as name and description. To change the view
# of these files, a repository uses the same glob in its own .vale.ini: a second section that also
# matches them makes Vale pick one of the two at random.
[*.{yml,yaml}]
View = Prose

[*.toml]
View = Prose

# The Code of Conduct is third-party text, the Contributor Covenant under CC BY 4.0. A rewrite that
# passes the rules changes the licensed wording, so Vale skips the file. NONE clears the styles and
# the rule settings of [*], and Vale then does not read the file.
[**/CODE_OF_CONDUCT.md]
BasedOnStyles = NONE

# Prompts checks instruction files for agents: AGENTS.md, CLAUDE.md and SKILL.md, and the Markdown
# files under .claude/agents, .claude/commands and .claude/rules. One section holds every glob,
# because Vale picks one of two matching sections at random. Its rules are turned on one by one,
# because a BasedOnStyles here would replace the list in [*] for these files, and `Prompts = error`
# does not turn a style on. Each rule is an error. A new Prompts release can add a rule: list it
# here.
[{**/{AGENTS,CLAUDE,SKILL}.md,**/.claude/{agents,commands,rules}/**/*.md}]
Prompts.Absolutes = error
Prompts.Contradiction = error
Prompts.Emphasis = error
Prompts.Frontmatter = error
Prompts.Imperative = error
Prompts.Length = error
Prompts.Paths = error
Prompts.SectionLength = error
Prompts.SkillName = error
Prompts.ThirdPerson = error
Prompts.TimeSensitive = error
Prompts.Trigger = error
Prompts.Vague = error

# Commit messages, read from stdin with `vale --path=COMMIT_EDITMSG`. The section of the Commits
# package sets the Commit view and turns on its Commits style: a blank line after the subject, the
# imperative mood, no placeholder subject such as "fix", and no whitespace at the edges of the
# subject. commit-check (cchk.toml) checks the type, the length and the case of the subject, so
# Conventional.Type and the Commitlint style stay off. The package has more rules in other styles, and a
# rule line turns one on without its style. Conventional adds the footers: the BREAKING CHANGE
# token, a blank line before the footers and a hyphen in place of a space in a token. It also adds a
# space after the colon and no empty scope. SevenRules.Wrap limits a body line to 72 characters. A
# line with a URL and a footer line are exempt. Gitlint reports trailing whitespace and tabs.
#
# A BasedOnStyles in a section replaces the list in [*] for its files, so this list names the styles
# again. [*] turns Readability.AutomatedReadability on by its level, so it runs here too, as an
# error and with the scope and the condition of [*].
[COMMIT_EDITMSG]
BasedOnStyles = write-good, Modelese, Vale
# Every alert on a commit message is an error and stops the commit. A level that [*] sets for a
# whole style does not pass to this section, and the Commits package makes two of its rules
# warnings, so each style is set to error here.
Commits.Imperative = error
Commits.Placeholder = error
Conventional.Breaking = error
Conventional.Footer = error
Conventional.Space = error
Conventional.Token = error
Conventional.Scope = error
SevenRules.Wrap = error
Gitlint.BodyTrailingWhitespace = error
Gitlint.HardTab = error
write-good = error
Modelese = error
Vale.Repetition = error
# A message names identifiers, tools and package names, in no dictionary and often in lower
# case, such as eslint-plugin-tsdoc in a subject.
Vale.Spelling = NO
Vale.khinse-labs.Terms = NO
Vale.Terms = NO
# `write-good = error` turns on every write-good rule, also the ones that [*] turns off. On
# messages they stay on.
ai-tells = error
# On past commit messages, all or nearly all alerts of these ai-tells rules were false.
# ColonUsage would stop every commit with a `Co-Authored-By:` trailer. ConsequenceClause flags
# ", so ...", which a body needs to give the reason for a change.
ai-tells.ColonUsage = NO
ai-tells.ConsequenceClause = NO
ai-tells.NounString = NO
ai-tells.VerbTricolon = NO
ai-tells.NegatedObject = NO
ai-tells.NegatedSubject = NO
ai-tells.CataphoricForecasting = NO
ai-tells.ShipOveruse = NO
ai-tells.BareNames = NO
ai-tells.BareReaches = NO
ai-tells.OverusedVocabulary = NO
ai-tells.FigurativeCarries = NO
ai-tells.FigurativeStays = NO
ai-tells.FigurativeLives = NO
ai-tells.FigurativeNouns = NO
ai-tells.FigurativeMints = NO
ai-tells.StrawmanContrast = NO
