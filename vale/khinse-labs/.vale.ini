# Base Vale config of the khinse-labs package. `vale sync` copies it into
# <StylesPath>/.vale-config/ of the repository, and Vale reads it before the repository's own
# .vale.ini. In the repository's file, a list key such as BasedOnStyles adds to the values here, and
# any other key, such as a rule level, replaces them. Usage: README.md, section "Shared Vale config".
#
# No StylesPath here: the repository's .vale.ini sets it.
MinAlertLevel = warning

# The grammars let Vale find the comments of YAML, TOML, TypeScript and shell files. The Prose view
# below and the Mts and Comments views need them. Vale installs only the grammars in this list,
# and a .mts glob alone does not install the TypeScript one. The first `vale sync` installs the
# package but not the grammars it names, so the repository's .vale.ini names them too. Without a
# grammar, Vale reads a comment as the text after its delimiter, even in a string.
Grammars = yaml, toml, typescript, bash

# Packages from the Vale package library. `vale sync` installs them beside this package. Each one is
# pinned to a release and to the SHA-256 of its archive. Only Vale 3.29.0 or later checks the digest.
# To update one, change the tag and the digest together: `vale sync --plain-progress` prints the
# digest of an archive that is not pinned. TechTerms is a dictionary, not a style: khinse-labs.Spelling
# loads it.
#
# Only Commits has a .vale.ini, and it sets MinAlertLevel = suggestion. `vale sync` copies it to
# .vale-config/ as 0-Commits.ini, from its index in this list, and Vale reads that folder in name
# order. Keep Commits first: its file then comes before <n>-khinse-labs.ini, and this file wins.
Packages = https://github.com/jdkato/commits/releases/download/v0.2.0/Commits.zip#sha256:ed383cd2233d24ca725e4546fa3a51e3e85684906c61420df9246ac889a52e39, \
  https://github.com/vale-cli/write-good/releases/download/v0.5.0/write-good.zip#sha256:1736c0b61aed16170d5af65f602d776a06dc1a563bc6552abfe5db6940190e22, \
  https://github.com/vale-cli/Readability/releases/download/v0.2.0/Readability.zip#sha256:cf8790677bb2ef86458c1d1dbd6e646fd8063c0e9621f81141e5cd85e5e41f81, \
  https://github.com/jdkato/TechTerms/releases/download/v0.1.0/TechTerms.zip#sha256:d51399527f97a65938097afb2ef8a55fe8993babe71e88e84f1b63170d1b5dac, \
  https://github.com/jdkato/Prompts/releases/download/v0.1.1/Prompts.zip#sha256:e06ee5b57e7f690f93c26a4cc1e644869b9aa078dd3700bd9c944f3545cdf4d7, \
  https://github.com/jdkato/Modelese/releases/download/v0.2.0/Modelese.zip#sha256:40b70578dc0e4437c9d7f7e29a283e960212553ecf068ea48feb725ccba27d5e, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip#sha256:f8d1e981abbfbac1aa092d1623a1ac9bc935f0b15e8071e7a072915abddf0570, \
  https://github.com/vale-cli/alex/releases/download/v0.3.0/alex.zip#sha256:3a45aafdb867964d7282a8c1f425d0b58e20f905d0e177f347c0e0c0712a6c7c

# The package has no [*.mts] sections, because their globs are paths of one repository. A
# repository that lints the prose of .mts files adds sections such as these to its own .vale.ini.
# Mts takes comments and message strings, Comments takes comments only. The sections must not
# overlap: Vale picks one of two matching sections at random.
#
#   [{scripts,src}/**/*.mts]
#   View = Mts
#
#   [tests/**/*.mts]
#   View = Comments

[*]
BasedOnStyles = khinse-labs, SE, write-good, Readability, Modelese, ai-tells, alex, Vale
# The vocabulary in styles/config/vocabularies/khinse-labs accepts "hook", which alex reports as
# possible profanity in every git hook. Vale adds an accepted term to the exceptions of every rule,
# so an ai-tells alert whose match holds "hook", such as "the hook fires", is gone too. Needs Vale
# 3.25.0 or later.
Vocab = khinse-labs
Vale.Terms = NO
Vale.Avoid = NO
Vale.Spelling = NO
Vale.Repetition = warning
# Three write-good rules are on, and all three have the level warning. khinse-labs.Weasel replaces
# write-good.Weasel, which flags "many" and "few".
write-good.Passive = warning
write-good.TooWordy = warning
write-good.Weasel = NO
write-good.Illusions = warning
write-good.Adverbs = NO
write-good.Cliches = NO
write-good.E-Prime = NO
write-good.So = NO
write-good.ThereIs = NO
# One readability score, per paragraph, so the alert lands where the text reads hard. SE already
# limits sentence and paragraph length, so the other scores are off. A short paragraph with one
# long word scores high, so a paragraph needs 25 words to count. The message of the rule still says
# "below 8": a config cannot change a message.
Readability = NO
Readability.FleschKincaid = warning
Readability.FleschKincaid[scope] = paragraph
Readability.FleschKincaid[condition] = "> 12 && words >= 25"
# Every ai-tells rule is an error in the package. Here they are warnings, like the other styles.
# Six of them repeat a rule of khinse-labs or SE, so they are off. FormalTransitions also flags
# "for example", which SE.Abbrev asks for.
ai-tells = warning
ai-tells.EmDashUsage = NO
ai-tells.DoubleHyphen = NO
ai-tells.SemicolonUsage = NO
ai-tells.FillerPhrases = NO
ai-tells.HedgingPhrases = NO
ai-tells.FormalTransitions = NO

# Vale reads a YAML or TOML file whole, as plain text, unless a view picks its prose. The Prose view
# picks the comments and the values of prose keys, such as name and description. To change the view
# of these files, a repository uses the same glob in its own .vale.ini: a second section that also
# matches them makes Vale pick one of the two at random.
[*.{yml,yaml}]
View = Prose

[*.toml]
View = Prose

# Prompts checks instruction files for agents. Its rules are turned on one by one, because a
# BasedOnStyles here would replace the list in [*] for these files, and `Prompts = YES` does not
# turn a style on. A new Prompts release can add a rule: list it here.
[**/{AGENTS,CLAUDE,SKILL}.md]
Prompts.Absolutes = YES
Prompts.Contradiction = YES
Prompts.Emphasis = YES
Prompts.Frontmatter = YES
Prompts.Imperative = YES
Prompts.Length = YES
Prompts.Paths = YES
Prompts.SectionLength = YES
Prompts.SkillName = YES
Prompts.ThirdPerson = YES
Prompts.TimeSensitive = YES
Prompts.Trigger = YES
Prompts.Vague = YES

# Commit messages, read from stdin with `vale --path=COMMIT_EDITMSG`. The section of the Commits
# package sets the Commit view and turns on its Commits style: a blank line after the subject, the
# imperative mood, no placeholder subject such as "fix", and no whitespace at the edges of the
# subject. commit-check (cchk.toml) checks the type, the length and the case of the subject, so the
# Conventional and Commitlint styles stay off.
#
# A BasedOnStyles in a section replaces the list in [*] for its files, so this list names the styles
# again. It leaves out Readability and ai-tells: on the bodies of real commit messages, nearly all
# their alerts were false. A rule that [*] turns on by its level still runs, so those lines are NO.
[COMMIT_EDITMSG]
BasedOnStyles = khinse-labs, SE, write-good, Modelese, alex, Vale
# Only the Commits rules stop a commit. The package makes these two warnings, which Vale lets pass.
Commits.Imperative = error
Commits.Placeholder = error
# The prose rules give warnings: a long sentence in the body does not stop a commit.
SE = warning
Modelese.Deferral = warning
# A body names identifiers and tools that are in no dictionary.
khinse-labs.Spelling = NO
# SE.Passive finds the same verbs.
write-good.Passive = NO
# It reports "failed" and "failure", which a fix message needs.
alex.ProfanityUnlikely = NO
Readability.FleschKincaid = NO
ai-tells = NO
