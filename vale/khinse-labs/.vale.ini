# Base Vale config of the khinse-labs package. `vale sync` copies it into
# <StylesPath>/.vale-config/ of the repository, and Vale reads it before the repository's own
# .vale.ini. In the repository's file, a list key such as BasedOnStyles adds to the values here, and
# any other key, such as a rule level, replaces them. Usage: README.md, section "Shared Vale config".
#
# No StylesPath and no Packages here: the repository's .vale.ini sets them.
# The write-good style is a vendored copy (see styles/write-good/SOURCE.md). Do not edit it.
# Change a rule here instead.
MinAlertLevel = warning
# The TypeScript grammar is vendored in styles/config/grammars (see SOURCE.md there). NONE stops
# Vale from downloading grammars. A repository that lints source code sets Grammars itself.
Grammars = NONE

# The package has no [*.mts] sections, because their globs are paths of one repository. A
# repository that lints the prose of .mts files adds sections such as these to its own .vale.ini.
# Mts takes comments and message strings, Comments takes comments only. The sections must not
# overlap: Vale picks one of two matching sections at random.
#
#   [{scripts,src}/**/*.mts]
#   View = Mts
#
#   [tests/**/*.mts]
#   View = Comments

[*]
BasedOnStyles = khinse-labs, SE, write-good, Vale
Vale.Terms = NO
Vale.Avoid = NO
Vale.Spelling = NO
Vale.Repetition = warning
# Three write-good rules are on, and all three have the level warning. khinse-labs.Weasel replaces
# write-good.Weasel, which flags "many" and "few".
write-good.Passive = warning
write-good.TooWordy = warning
write-good.Weasel = NO
write-good.Illusions = warning
write-good.Adverbs = NO
write-good.Cliches = NO
write-good.E-Prime = NO
write-good.So = NO
write-good.ThereIs = NO
