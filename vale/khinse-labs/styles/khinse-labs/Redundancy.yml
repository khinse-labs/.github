# Finds a phrase that says one thing twice. Own short list. write-good.TooWordy finds more, such
# as "close proximity" and "each and every", so they are not here.
extends: existence
message: "'%s' says one thing twice. Use the shorter form."
level: warning
ignorecase: true
tokens:
  - ask the question directly
  - future plans
  - end result
  - final outcome
  - basic fundamentals
  - completely finished
  - past history
  - revert back
  - unexpected surprise
  - added bonus
  - join together
  - repeat again
  - still remains
tests:
  - name: flags a redundant phrase
    input: The end result is good.
    want: |
      1:5:khinse-labs.Redundancy:'end result' says one thing twice. Use the shorter form.
  - name: leaves the short form alone
    input: The result is good.
    want: ''
