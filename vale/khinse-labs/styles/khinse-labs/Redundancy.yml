# Finds a phrase that says one thing twice. Own short list.
extends: existence
message: "'%s' says one thing twice. Use the shorter form."
level: warning
ignorecase: true
tokens:
  - ask the question directly
  - close proximity
  - future plans
  - end result
  - final outcome
  - basic fundamentals
  - completely finished
  - each and every
  - past history
  - revert back
  - unexpected surprise
  - added bonus
  - join together
  - repeat again
  - still remains
