extends: capitalization
message: "'%s' should use sentence case"
level: error
scope: heading
match: $sentence
exceptions:
  - marketplace-internal
  - orchestration
  - writing
  - '@?imports'
  - '\.?gitignore'
  - 'scripts/lint-docs\.sh'
  - 'CLAUDE\.md'
  - Claude Code
  - Claude
  - Simplified English
  - Vale
  - 'khinse-labs(?:/\.github)?'
  - Contributor Covenant
  - Code of Conduct
tests:
  - name: flags a title-case heading
    input: '# Shared Config File'
    want: |
      1:3:khinse-labs.Headings:'Shared Config File' should use sentence case
  - name: leaves a sentence-case heading alone
    input: '# Shared config file'
    want: ''
  - name: leaves proper names in a heading alone
    input: |
      # khinse-labs/.github

      ## Shared Vale config

      ## Contributor Covenant Code of Conduct
    want: ''
