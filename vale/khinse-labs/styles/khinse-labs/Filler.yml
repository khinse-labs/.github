# Filler phrases. SE.Filler and SE.Words find the single filler words, so they are not here.
extends: existence
message: "Remove the filler '%s'."
level: warning
ignorecase: true
tokens:
  - please note
  - note that
  - it is important to
  - make sure that
tests:
  - name: flags a filler phrase
    input: Note that the build is slow.
    want: |
      1:1:khinse-labs.Filler:Remove the filler 'Note that'.
  - name: leaves the plain sentence alone
    input: The build is slow.
    want: ''
