# Filler phrases. SE.Filler, SE.Words and write-good find the single filler words, so they are not
# here.
# Modelese.Importance finds "it is important to".
extends: existence
message: "Remove the filler '%s'."
level: warning
ignorecase: true
tokens:
  - please note
  - note that
  - make sure that
tests:
  - name: flags a filler phrase
    input: Note that the build is slow.
    want: |
      1:1:khinse-labs.Filler:Remove the filler 'Note that'.
  - name: leaves the plain sentence alone
    input: The build is slow.
    want: ''
