# A double hyphen with spaces acts as a dash. The rule reads prose only, so a `--` comment
# in a code fence, such as SQL, is not an alert.
extends: existence
message: "Do not use ' -- ' as a dash. Use a period, a comma or a colon."
level: warning
scope: text
nonword: true
tokens:
  - ' -- '
tests:
  - name: flags a spaced double hyphen
    input: Ship it -- now.
    want: |
      1:8:khinse-labs.DoubleHyphen:Do not use ' -- ' as a dash. Use a period, a comma or a colon.
  - name: leaves a flag in a code span alone
    input: Run `ls -- now` first.
    want: ''
