extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  sub-agents?: subagent
  Node\.js: Node
  orchestrator: main session
  (?-i:[Ff]rontmatter): front matter
  work tree: worktree
  run time: runtime
tests:
  - name: flags a term with a house spelling
    input: Start two sub-agents.
    want: |
      1:11:khinse-labs.Terms:Use 'subagent' instead of 'sub-agents'.
  - name: leaves the house spelling alone
    input: Start two subagents.
    want: ''
