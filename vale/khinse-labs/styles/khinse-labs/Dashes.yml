# The em dash joins clauses in a way that Simplified English does not allow. The rule reads the
# raw text, so it also finds em dashes in code fences, such as output templates.
extends: existence
message: "Do not use the em dash. Use a period, a comma or a colon."
level: warning
scope: raw
nonword: true
tokens:
  - '—'
tests:
  - name: flags an em dash
    input: Ship it — now.
    want: |
      1:9:khinse-labs.Dashes:Do not use the em dash. Use a period, a comma or a colon.
  - name: leaves a comma alone
    input: Ship it, now.
    want: ''
