# Simplified English: Finds a run of capitalized words. Write the phrase in lower case. The labels WARNING, CAUTION, NOTE and STATUS are allowed, and so is BREAKING CHANGE, the footer token that Conventional Commits requires in capitals.
extends: existence
message: "Capitalized phrase '%s': write it in lower case."
level: error
tokens:
  - '\b(?!(?:WARNING|CAUTION|NOTE|STATUS)\b|BREAKING[ -]CHANGE\b)[A-Z][A-Z'']+(?:\s+(?!(?:WARNING|CAUTION|NOTE|STATUS)\b)[A-Z][A-Z'']+)+\b'
tests:
  - name: flags a capitalized phrase
    input: Read the RELEASE NOTES first.
    want: |
      1:10:SE.CapsPhrase:Capitalized phrase 'RELEASE NOTES': write it in lower case.
  - name: leaves one acronym alone
    input: Read the API docs first.
    want: ''
  - name: leaves the breaking-change footer of a commit message alone
    format: COMMIT_EDITMSG
    view: Commit
    input: |
      feat!: drop the legacy flag

      The parser no longer reads it.

      BREAKING CHANGE: the --legacy flag is gone.
    want: ''
