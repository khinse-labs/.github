# Simplified English: Finds a run of capitalized words. Write the phrase in lower case. The labels WARNING, CAUTION, NOTE and STATUS are allowed.
extends: existence
message: "Capitalized phrase '%s': write it in lower case."
level: error
tokens:
  - '\b(?!(?:WARNING|CAUTION|NOTE|STATUS)\b)[A-Z][A-Z'']+(?:\s+(?!(?:WARNING|CAUTION|NOTE|STATUS)\b)[A-Z][A-Z'']+)+\b'
tests:
  - name: flags a capitalized phrase
    input: Read the RELEASE NOTES first.
    want: |
      1:10:SE.CapsPhrase:Capitalized phrase 'RELEASE NOTES': write it in lower case.
  - name: leaves one acronym alone
    input: Read the API docs first.
    want: ''
