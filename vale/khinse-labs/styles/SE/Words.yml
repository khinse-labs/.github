# Simplified English: Replaces words that Simplified English does not allow.
extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: true
swap:
  utilize: use
  utilise: use
  utilization: use
  leverage: use
  make use of: use
  in order to: to
  prior to: before
  in the event that: if
  due to the fact that: because
  a number of: some, many or the count
  commence: start
  initiate: start
  terminate: stop or end
  facilitate: help
  endeavor: try
  sufficient: enough
  numerous: many
  approximately: about
  subsequently: then or later
  whilst: while
  ensure: make sure
  additionally: also
  in addition: also
  thus: so
  hence: so
  therefore: so
  with regard to: about
  regarding: about
  carry out: do
  spin up: start
  sanity check: quick check
  comprise: include
  whether or not: whether
  in terms of: for, in or about
