# Simplified English: Finds filler words that add no meaning.
extends: existence
message: "Remove the filler '%s'."
level: warning
ignorecase: true
tokens:
  - very
  - quite
  - simply
  - just
  - easily
  - basically
  - really
  - actually
  - obviously
  - please
tests:
  - name: flags a filler word
    input: Just run the tests.
    want: |
      1:1:SE.Filler:Remove the filler 'Just'.
  - name: leaves the plain sentence alone
    input: Run the tests.
    want: ''
