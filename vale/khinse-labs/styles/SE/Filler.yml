# Simplified English: Finds filler words that add no meaning. write-good.Adverbs and
# write-good.Weasel find the others, such as "just" and "very", so they are not here.
extends: existence
message: "Remove the filler '%s'."
level: warning
ignorecase: true
tokens:
  - actually
  - please
tests:
  - name: flags a filler word
    input: Please run the tests.
    want: |
      1:1:SE.Filler:Remove the filler 'Please'.
  - name: leaves the plain sentence alone
    input: Run the tests.
    want: ''
