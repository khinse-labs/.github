# Simplified English: Limits a sentence to 25 words. The rule counts runs of non-space characters, because the metric rule splits words on hyphens, dots and slashes.
extends: occurrence
message: "The sentence has more than 25 words."
level: error
scope: sentence
max: 25
token: '\S+'
tests:
  - name: flags a sentence of 26 words
    input: a b c d e f g h i j k l m n o p q r s t u v w x y z.
    contains: SE.SentenceLength
  - name: leaves a sentence of 25 words alone
    input: a b c d e f g h i j k l m n o p q r s t u v w x y.
    want: ''
