# Simplified English: Finds capital letters used for emphasis.
extends: existence
message: "'%s': no capital letters for emphasis."
level: error
tokens:
  - '\b(?:MUST|NEVER|ALWAYS|CRITICAL|IMPORTANT|REQUIRED|SHOULD|SHALL|ONLY|DON''T)\b'
tests:
  - name: flags a shouted word
    input: You MUST run the tests.
    want: |
      1:5:SE.Shout:'MUST': no capital letters for emphasis.
  - name: leaves the lower-case word alone
    input: You must run the tests.
    want: ''
