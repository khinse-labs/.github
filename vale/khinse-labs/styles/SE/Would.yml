# Simplified English: Finds would. Use the present tense if it is correct.
extends: existence
message: "'%s': use the present tense if it is correct."
level: error
ignorecase: true
tokens:
  - would
tests:
  - name: flags would
    input: The script would fail.
    want: |
      1:12:SE.Would:'would': use the present tense if it is correct.
  - name: leaves the present tense alone
    input: The script fails.
    want: ''
  - name: reads the comments and prose values of a YAML file through the Prose view
    format: yml
    view: Prose
    input: |
      # The job would fail.
      name: Build
      description: The script would fail.
      run: echo "it would fail"
      options:
        - Tooling
        - It would break
    want: |
      1:11:SE.Would:'would': use the present tense if it is correct.
      3:25:SE.Would:'would': use the present tense if it is correct.
      7:8:SE.Would:'would': use the present tense if it is correct.
