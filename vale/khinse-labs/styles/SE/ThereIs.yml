# Simplified English: Finds sentences that start with there is or there are.
extends: existence
message: "Start with the real subject, not '%s'."
level: warning
ignorecase: true
tokens:
  - there is
  - there are
tests:
  - name: flags a sentence that starts with there is
    input: There is a bug in the parser.
    want: |
      1:1:SE.ThereIs:Start with the real subject, not 'There is'.
  - name: leaves the real subject alone
    input: The parser has a bug.
    want: ''
