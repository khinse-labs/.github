# Simplified English: Limits a list item to 6 sentences.
extends: metric
message: "List item has %s sentences (max 6)."
level: error
scope: list
formula: round(sentences)
condition: "> 6.0"
tests:
  - name: flags a list item of seven sentences
    input: |
      - One. Two. Three. Four. Five. Six. Seven.
    contains: SE.ListLength
  - name: leaves a list item of six sentences alone
    input: |
      - One. Two. Three. Four. Five. Six.
    want: ''
