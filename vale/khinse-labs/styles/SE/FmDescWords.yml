# Simplified English: Limits each sentence of the front matter description to 25 words. A regex does this because the metric rule splits words on hyphens, dots and slashes.
extends: existence
message: "The description sentence has more than 25 words."
level: error
scope: text.frontmatter.description
nonword: true
tokens:
  - '(?:\S*[^\s.!?]\s+){25}\S+'
tests:
  - name: flags a description sentence of 26 words
    input: |
      ---
      description: a b c d e f g h i j k l m n o p q r s t u v w x y z.
      ---
      Body.
    contains: SE.FmDescWords
  - name: leaves a description sentence of 25 words alone
    input: |
      ---
      description: a b c d e f g h i j k l m n o p q r s t u v w x y.
      ---
      Body.
    want: ''
