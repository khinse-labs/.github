# Commit, branch, author, tag and file conventions for khinse-labs repositories, checked by
# commit-check (https://commit-check.com). Needs uv (https://docs.astral.sh/uv/) on the machine,
# and a cchk.toml in the repository that inherits ours:
#
#   inherit_from = "github:khinse-labs/.github:cchk.toml"
#
# Use it from a repository's lefthook.yml:
#
#   remotes:
#     - git_url: https://github.com/khinse-labs/.github
#       ref: v1.0.0 # a tag: lefthook cannot clone a commit SHA
#       configs:
#         - lefthook/conventions.yml
#
# Force pushes stay allowed: branches are rebased onto main.

commit-msg:
  commands:
    commit-check:
      run: uvx --quiet commit-check@2.18.3 --no-banner --message {1}

pre-commit:
  commands:
    commit-check:
      run: uvx --quiet commit-check@2.18.3 --no-banner --branch --author-name --author-email

pre-push:
  commands:
    commit-check:
      run: uvx --quiet commit-check@2.18.3 --no-banner --tag --files
