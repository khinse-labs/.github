# Commit, branch, author, tag, file and push conventions for khinse-labs repositories, checked by
# commit-check (https://commit-check.com) against the repository's own cchk.toml, which inherits ours:
#
#   inherit_from = "github:khinse-labs/.github@v1.3.0:cchk.toml"
#
# Needs uv (https://docs.astral.sh/uv/) and lefthook (`uv tool install lefthook`, then
# `lefthook install` in the repository). Use it from the repository's lefthook.yml:
#
#   remotes:
#     - git_url: https://github.com/khinse-labs/.github
#       ref: v1.3.0
#       configs:
#         - lefthook/conventions.yml
#
# lefthook skips the pre-commit and pre-push jobs when no files changed (an empty commit, or a
# push of commits that change no files). The Commit Check GitHub App still checks branch names and
# authors on pull requests.

commit-msg:
  jobs:
    - name: commit-check
      run: uvx --quiet commit-check@2.18.3 --no-banner --message {1}

pre-commit:
  jobs:
    - name: commit-check
      run: uvx --quiet commit-check@2.18.3 --no-banner --branch --author-name --author-email

pre-push:
  jobs:
    - name: commit-check
      run: uvx --quiet commit-check@2.18.3 --no-banner --tag --files --no-force-push
      use_stdin: true # the pushed refs, for --no-force-push
