# The Commit Check GitHub App does not read the file that these hooks use. If a repo has a config
# that inherits ours, the App stops its reports on pull requests (seen 2026-10-09 and 2026-10-10).
# If it has none, the App checks them against our cchk.toml.
#
# lefthook skips the pre-commit and pre-push jobs when no files changed, such as for an empty
# commit. The App still checks branch names and authors on pull requests.

commit-msg:
  jobs:
    - name: commit-check
      run: uvx --quiet commit-check@2.18.3 --no-banner --config .lefthook/cchk.toml --message {1}
    # Without a .vale.ini the repository does not use Vale. With one, a missing vale fails, as uv does.
    - name: vale
      run: |
        [ -f .vale.ini ] || exit 0
        case "$(head -n 1 {1})" in
          "Merge "* | "Revert "* | "Reapply "* | "fixup! "* | "squash! "* | "amend! "*) exit 0 ;;
        esac
        vale --path=COMMIT_EDITMSG < {1}

pre-commit:
  jobs:
    - name: commit-check
      run: uvx --quiet commit-check@2.18.3 --no-banner --config .lefthook/cchk.toml --branch --author-name --author-email

pre-push:
  jobs:
    - name: commit-check
      run: uvx --quiet commit-check@2.18.3 --no-banner --config .lefthook/cchk.toml --tag --files --no-force-push
      use_stdin: true # the pushed refs, for the no-force-push check
