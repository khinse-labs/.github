# Commit rules for every khinse-labs repository: https://commit-check.com
# A repository opts in with a cchk.toml of its own that starts with
#   inherit_from = "github:khinse-labs/.github:cchk.toml"
# and overrides only what it needs to.

[commit]
# https://www.conventionalcommits.org
conventional_commits = true
# The types in CONTRIBUTING.md.
allow_commit_types = [
  "feat",
  "fix",
  "docs",
  "style",
  "refactor",
  "test",
  "chore",
  "perf",
  "build",
  "ci",
  "revert",
]
subject_capitalized = false
subject_min_length = 5
subject_max_length = 72
allow_merge_commits = false
allow_revert_commits = true
allow_fixup_commits = true
allow_wip_commits = false
allow_empty_commits = false
ignore_authors = ["renovate[bot]", "dependabot[bot]"]

[branch]
# https://conventionalbranch.org: `<type>/<description>`, such as `feat/12-scan-barcode`. The default
# types cover the commit types above plus tool prefixes (`claude/`, `renovate/`, `dependabot/`).
conventional_branch = true

[pull_request]
# PRs are squash merged, so the GitHub App checks the message the squash would land on main
# (built from the repository's merge settings, PR title included) instead of each commit.
check = "squash"
